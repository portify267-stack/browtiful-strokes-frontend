<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="100%" height="100%">
  <defs>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#D4B06A" />
      <stop offset="100%" stop-color="#947435" />
    </linearGradient>
    <pattern id="checks" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#D4B06A" stroke-width="0.5" opacity="0.3"/>
      <circle cx="10" cy="10" r="1.5" fill="#6B7753"/>
    </pattern>
  </defs>
  <rect width="600" height="600" fill="#F8F5ED"/>
  <rect x="20" y="20" width="560" height="560" fill="none" stroke="#E4DCCB" stroke-width="2"/>

  <!-- Intricate forearm filler pattern blocks -->
  <g transform="translate(300, 250)">
    <!-- Main structural boundary -->
    <path d="M -130 -130 L 130 -130 L 100 130 L -100 130 Z" fill="none" stroke="#6B7753" stroke-width="2" />
    
    <!-- Checked pattern fill inside block -->
    <path d="M -130 -130 L 130 -130 L 100 130 L -100 130 Z" fill="url(#checks)" />
    
    <!-- Central Paisley Medallion overlapping checks -->
    <g transform="translate(0, 0)" scale="0.9">
      <path d="M 0 -70 C 50 -40, 50 30, 0 60 C -50 30, -50 -40, 0 -70 Z" fill="#F8F5ED" stroke="#6B7753" stroke-width="2"/>
      <circle cx="0" cy="0" r="30" fill="none" stroke="url(#goldGrad)" stroke-width="1.5"/>
      <circle cx="0" cy="0" r="20" fill="none" stroke="#6B7753" stroke-width="1" stroke-dasharray="2,2"/>
      <path d="M0 -15 C6 -8, 6 8, 0 15 C-6 8, -6 -8, 0 -15 Z" fill="url(#goldGrad)"/>
    </g>
    
    <!-- Bottom scalloped arches -->
    <path d="M -100 130 Q -50 110, 0 130 Q 50 110, 100 130" fill="none" stroke="#6B7753" stroke-width="1.5" />
    <path d="M -100 140 Q -50 120, 0 140 Q 50 120, 100 140" fill="none" stroke="url(#goldGrad)" stroke-width="1.5" />
  </g>

  <!-- Title Text -->
  <text x="300" y="490" font-family="'Playfair Display', serif" font-size="24" font-weight="bold" fill="#6B7753" text-anchor="middle">Heavy Bridal Forearm Coverage</text>
  <text x="300" y="520" font-family="'Inter', sans-serif" font-size="12" font-weight="600" fill="url(#goldGrad)" letter-spacing="3" text-anchor="middle">BROWTIFUL STROKES GALLERY</text>
</svg>

