<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="100%" height="100%">
  <defs>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#d2af66" />
      <stop offset="100%" stop-color="#D4B06A" />
    </linearGradient>
  </defs>
  <rect width="600" height="600" fill="#6B7753"/>
  <rect x="20" y="20" width="560" height="560" fill="none" stroke="url(#gold)" stroke-width="1" opacity="0.6"/>

  <!-- Minimalist vine + dot pattern -->
  <g transform="translate(300, 260)" stroke="url(#gold)" stroke-width="1.5" fill="none">
    <!-- Center delicate branch -->
    <path d="M 0 150 Q 30 50, 0 -50 Q -30 -150, 0 -220" />
    
    <!-- Delicate leaflets -->
    <path d="M 12 100 Q 25 90, 20 80 Q 8 90, 12 100 Z" fill="url(#gold)" stroke="none" />
    <path d="M -12 70 Q -25 60, -20 50 Q -8 60, -12 70 Z" fill="url(#gold)" stroke="none" />
    <path d="M 15 20 Q 28 10, 23 0 Q 11 10, 15 20 Z" fill="url(#gold)" stroke="none" />
    <path d="M -15 -10 Q -28 -20, -23 -30 Q -11 -20, -15 -10 Z" fill="url(#gold)" stroke="none" />
    <path d="M 12 -80 Q 25 -90, 20 -100 Q 8 -90, 12 -80 Z" fill="url(#gold)" stroke="none" />
    
    <!-- Little dots grouping (geometric stars) -->
    <circle cx="60" cy="-60" r="2" fill="url(#gold)" stroke="none" />
    <circle cx="68" cy="-60" r="1" fill="url(#gold)" stroke="none" />
    <circle cx="60" cy="-52" r="1" fill="url(#gold)" stroke="none" />
    <circle cx="52" cy="-60" r="1" fill="url(#gold)" stroke="none" />
    <circle cx="60" cy="-68" r="1" fill="url(#gold)" stroke="none" />

    <circle cx="-60" cy="40" r="2" fill="url(#gold)" stroke="none" />
    <circle cx="-52" cy="40" r="1" fill="url(#gold)" stroke="none" />
    <circle cx="-68" cy="40" r="1" fill="url(#gold)" stroke="none" />
  </g>

  <!-- Title Text -->
  <text x="300" y="490" font-family="'Playfair Display', serif" font-size="24" font-weight="bold" fill="#F8F5ED" text-anchor="middle">Minimalist Modern Henna</text>
  <text x="300" y="520" font-family="'Inter', sans-serif" font-size="12" font-weight="600" fill="url(#gold)" letter-spacing="3" text-anchor="middle">BROWTIFUL STROKES GALLERY</text>
</svg>

