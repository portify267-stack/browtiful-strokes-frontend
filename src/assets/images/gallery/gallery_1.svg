<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6B7753" />
      <stop offset="100%" stop-color="#0f291e" />
    </linearGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#d2af66" />
      <stop offset="100%" stop-color="#D4B06A" />
    </linearGradient>
  </defs>
  <rect width="600" height="600" fill="url(#bg)"/>
  <rect x="20" y="20" width="560" height="560" fill="none" stroke="url(#gold)" stroke-width="1.5" opacity="0.8"/>
  
  <!-- Mandala Center -->
  <g transform="translate(300, 270)" scale="1.4">
    <circle cx="0" cy="0" r="80" fill="none" stroke="url(#gold)" stroke-width="1" opacity="0.3" stroke-dasharray="5,5"/>
    <circle cx="0" cy="0" r="60" fill="none" stroke="url(#gold)" stroke-width="1.5"/>
    <circle cx="0" cy="0" r="40" fill="none" stroke="url(#gold)" stroke-width="1" stroke-dasharray="2,2"/>
    
    <!-- Flower Petals Radial -->
    <path d="M0 -40 C10 -20, 10 20, 0 40 C-10 20, -10 -20, 0 -40 Z" fill="url(#gold)" opacity="0.8"/>
    <path d="-40 0 C-20 -10, 20 -10, 40 0 C 20 10, -20 10, -40 0 Z" fill="url(#gold)" opacity="0.8"/>
    <path d="-28.28 -28.28 Q0 0 28.28 28.28" stroke="url(#gold)" stroke-width="2" opacity="0.6"/>
    <path d="-28.28 28.28 Q0 0 28.28 -28.28" stroke="url(#gold)" stroke-width="2" opacity="0.6"/>

    <circle cx="0" cy="0" r="10" fill="#6B7753" stroke="url(#gold)" stroke-width="1.5"/>
    <circle cx="0" cy="0" r="4" fill="url(#gold)"/>
  </g>

  <!-- Title Text -->
  <text x="300" y="490" font-family="'Playfair Display', serif" font-size="24" font-weight="bold" fill="#F8F5ED" text-anchor="middle">Bridal Henna Hand Pattern</text>
  <text x="300" y="520" font-family="'Inter', sans-serif" font-size="12" font-weight="600" fill="url(#gold)" letter-spacing="3" text-anchor="middle">BROWTIFUL STROKES GALLERY</text>
</svg>

