<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="100%" height="100%">
  <defs>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#D4B06A" />
      <stop offset="100%" stop-color="#947435" />
    </linearGradient>
  </defs>
  <rect width="600" height="600" fill="#E4DCCB"/>
  <rect x="20" y="20" width="560" height="560" fill="none" stroke="#D4B06A" stroke-width="1.5"/>

  <!-- Floral Branches -->
  <g transform="translate(300, 260)" stroke="#6B7753" stroke-width="2" fill="none">
    <!-- Main stem -->
    <path d="M -120 120 Q -40 20, 60 -100 Q 120 -150, 160 -180" />
    
    <!-- Leaves / Vines -->
    <!-- Leaf 1 -->
    <path d="M 0 0 C 15 -30, 45 -30, 40 10 C 25 10, 10 5, 0 0" fill="url(#gold)" stroke="#6B7753" stroke-width="1.5"/>
    <!-- Leaf 2 -->
    <path d="M -60 60 C -90 60, -90 30, -50 20 C -40 30, -50 50, -60 60" fill="url(#gold)" stroke="#6B7753" stroke-width="1.5"/>
    <!-- Flower Top -->
    <g transform="translate(60, -100)">
      <circle cx="0" cy="0" r="15" fill="#F8F5ED" stroke="#6B7753" stroke-width="2" />
      <!-- Petals -->
      <path d="M -25 -25 L -10 -10" />
      <path d="M 25 -25 L 10 -10" />
      <path d="M -25 25 L -10 10" />
      <path d="M 25 25 L 10 10" />
      <circle cx="0" cy="0" r="6" fill="url(#gold)" stroke="none" />
    </g>
    
    <!-- Swirls -->
    <path d="M -10 -15 A 20 20 0 1 1 -30 -35" />
    <path d="M 100 -120 A 15 15 0 1 0 85 -105" />
  </g>

  <!-- Title Text -->
  <text x="300" y="490" font-family="'Playfair Display', serif" font-size="24" font-weight="bold" fill="#6B7753" text-anchor="middle">Detailed Floral Henna Pattern</text>
  <text x="300" y="520" font-family="'Inter', sans-serif" font-size="12" font-weight="600" fill="#D4B06A" letter-spacing="3" text-anchor="middle">BROWTIFUL STROKES GALLERY</text>
</svg>

