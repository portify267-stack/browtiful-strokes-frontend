<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="100%" height="100%">
  <defs>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#d2af66" />
      <stop offset="100%" stop-color="#D4B06A" />
    </linearGradient>
  </defs>
  <rect width="600" height="600" fill="#6B7753"/>
  <rect x="20" y="20" width="560" height="560" fill="none" stroke="url(#gold)" stroke-width="1.5" opacity="0.8"/>

  <!-- Minimalist / Elegant Lines representing fingers detail -->
  <g transform="translate(300, 260)" stroke="url(#gold)" stroke-width="2" fill="none">
    <!-- Vertical lines resembling fingers with rings -->
    <!-- Finger 1 -->
    <g transform="translate(-80, 0)">
      <line x1="0" y1="-120" x2="0" y2="120" opacity="0.3"/>
      <!-- Ring detail -->
      <rect x="-10" y="-30" width="20" height="8" rx="2" fill="url(#gold)" stroke="none"/>
      <circle cx="0" cy="-60" r="4" fill="none" stroke-width="1.5"/>
      <circle cx="0" cy="-80" r="2" fill="url(#gold)" stroke="none"/>
    </g>
    <!-- Finger 2 (Center) -->
    <g transform="translate(0, -20)">
      <line x1="0" y1="-120" x2="0" y2="140" stroke-width="2.5"/>
      <!-- Double rings -->
      <rect x="-12" y="-10" width="24" height="6" rx="1" fill="url(#gold)" stroke="none"/>
      <rect x="-12" y="-22" width="24" height="6" rx="1" fill="url(#gold)" stroke="none"/>
      <circle cx="0" cy="-70" r="6" fill="none" stroke-width="2"/>
      <path d="M -10 -90 L 10 -90 M -6 -95 L 6 -95" />
    </g>
    <!-- Finger 3 -->
    <g transform="translate(80, 10)">
      <line x1="0" y1="-120" x2="0" y2="110" opacity="0.3"/>
      <!-- Ring detail -->
      <rect x="-10" y="-40" width="20" height="8" rx="2" fill="url(#gold)" stroke="none"/>
      <path d="M-8 -70 Q0 -60 8 -70" />
    </g>
    
    <!-- Connector Swirl underneath -->
    <path d="M -150 100 Q 0 150, 150 100" stroke-width="1.5" />
    <path d="M -100 120 Q 0 160, 100 120" stroke-width="0.75" stroke-dasharray="3,3" />
  </g>

  <!-- Title Text -->
  <text x="300" y="490" font-family="'Playfair Display', serif" font-size="24" font-weight="bold" fill="#F8F5ED" text-anchor="middle">Elegant Finger Details</text>
  <text x="300" y="520" font-family="'Inter', sans-serif" font-size="12" font-weight="600" fill="url(#gold)" letter-spacing="3" text-anchor="middle">BROWTIFUL STROKES GALLERY</text>
</svg>

