<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="100%" height="100%">
  <defs>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#D4B06A" />
      <stop offset="100%" stop-color="#947435" />
    </linearGradient>
  </defs>
  <rect width="600" height="600" fill="#F8F5ED"/>
  <rect x="20" y="20" width="560" height="560" fill="none" stroke="#E4DCCB" stroke-width="2"/>
  <rect x="28" y="28" width="544" height="544" fill="none" stroke="#D4B06A" stroke-width="0.75" stroke-dasharray="4,4"/>

  <!-- Rajasthani Mandala Radial -->
  <g transform="translate(300, 270)" scale="1.3">
    <!-- Star Base -->
    <path d="M 0 -80 L 15 -30 L 65 -50 L 30 0 L 80 0 L 30 15 L 65 50 L 15 30 L 0 80 L -15 30 L -65 50 L -30 0 L -80 0 L -30 -15 L -65 -50 L -15 -30 Z" fill="none" stroke="url(#goldGrad)" stroke-width="1.5" />
    
    <circle cx="0" cy="0" r="50" fill="none" stroke="#6B7753" stroke-width="2"/>
    <circle cx="0" cy="0" r="40" fill="none" stroke="url(#goldGrad)" stroke-width="1" stroke-dasharray="2,2"/>
    
    <!-- Center flower -->
    <path d="M0 -30 C10 -15, 10 15, 0 30 C-10 15, -10 -15, 0 -30 Z" fill="#6B7753" opacity="0.9"/>
    <path d="-30 0 C-15 -10, 15 -10, 30 0 C 15 10, -15 10, -30 0 Z" fill="#6B7753" opacity="0.9"/>
    
    <circle cx="0" cy="0" r="8" fill="url(#goldGrad)"/>
    <circle cx="0" cy="0" r="3" fill="#F8F5ED"/>
  </g>

  <!-- Title Text -->
  <text x="300" y="490" font-family="'Playfair Display', serif" font-size="24" font-weight="bold" fill="#6B7753" text-anchor="middle">Traditional Rajasthani Mandala</text>
  <text x="300" y="520" font-family="'Inter', sans-serif" font-size="12" font-weight="600" fill="#D4B06A" letter-spacing="3" text-anchor="middle">BROWTIFUL STROKES GALLERY</text>
</svg>

