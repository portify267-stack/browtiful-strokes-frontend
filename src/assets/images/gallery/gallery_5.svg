<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="100%" height="100%">
  <defs>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#D4B06A" />
      <stop offset="100%" stop-color="#947435" />
    </linearGradient>
  </defs>
  <rect width="600" height="600" fill="#F8F5ED"/>
  <rect x="20" y="20" width="560" height="560" fill="none" stroke="#E4DCCB" stroke-width="2"/>

  <!-- Backhand glove mesh lace pattern -->
  <g transform="translate(300, 260)" stroke="#6B7753" stroke-width="1.2" fill="none">
    <!-- Grid/Mesh rotated -->
    <g transform="rotate(45)">
      <!-- Horizontal lines -->
      <line x1="-120" y1="-80" x2="120" y2="-80" />
      <line x1="-120" y1="-40" x2="120" y2="-40" />
      <line x1="-120" y1="0" x2="120" y2="0" />
      <line x1="-120" y1="40" x2="120" y2="40" />
      <line x1="-120" y1="80" x2="120" y2="80" />
      <!-- Vertical lines -->
      <line x1="-80" y1="-120" x2="-80" y2="120" />
      <line x1="-40" y1="-120" x2="-40" y2="120" />
      <line x1="0" y1="-120" x2="0" y2="120" />
      <line x1="40" y1="-120" x2="40" y2="120" />
      <line x1="80" y1="-120" x2="80" y2="120" />
      
      <!-- Dots at intersections -->
      <circle cx="0" cy="0" r="3" fill="#D4B06A" stroke="none" />
      <circle cx="-40" cy="0" r="2.5" fill="#D4B06A" stroke="none" />
      <circle cx="40" cy="0" r="2.5" fill="#D4B06A" stroke="none" />
      <circle cx="0" cy="-40" r="2.5" fill="#D4B06A" stroke="none" />
      <circle cx="0" cy="40" r="2.5" fill="#D4B06A" stroke="none" />
      <circle cx="40" cy="40" r="2" fill="#D4B06A" stroke="none" />
      <circle cx="-40" cy="-40" r="2" fill="#D4B06A" stroke="none" />
      <circle cx="40" cy="-40" r="2" fill="#D4B06A" stroke="none" />
      <circle cx="-40" cy="40" r="2" fill="#D4B06A" stroke="none" />
    </g>

    <!-- Outer paisley border of backhand lace -->
    <path d="M -110 -110 Q 0 -170, 110 -110" stroke-width="2"/>
    <path d="M -110 -110 C -150 -60, -150 60, -110 110" stroke-width="2"/>
    <path d="M 110 -110 C 150 -60, 150 60, 110 110" stroke-width="2"/>
    <path d="M -110 110 Q 0 170, 110 110" stroke-width="2"/>
  </g>

  <!-- Title Text -->
  <text x="300" y="490" font-family="'Playfair Display', serif" font-size="24" font-weight="bold" fill="#6B7753" text-anchor="middle">Bridal Back Hand Work</text>
  <text x="300" y="520" font-family="'Inter', sans-serif" font-size="12" font-weight="600" fill="url(#gold)" letter-spacing="3" text-anchor="middle">BROWTIFUL STROKES GALLERY</text>
</svg>

