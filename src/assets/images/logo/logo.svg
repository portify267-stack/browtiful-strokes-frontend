<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 250 70" width="100%" height="100%">
  <defs>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#D4B06A" />
      <stop offset="100%" stop-color="#947435" />
    </linearGradient>
  </defs>
  <!-- Background -->
  <rect width="250" height="70" rx="6" fill="transparent"/>
  
  <!-- Left Side Henna Swirl Icon -->
  <g transform="translate(10, 10)">
    <circle cx="25" cy="25" r="18" fill="none" stroke="url(#goldGrad)" stroke-width="1.5" stroke-dasharray="2,2"/>
    <circle cx="25" cy="25" r="14" fill="none" stroke="#6B7753" stroke-width="1"/>
    
    <!-- Mandala center -->
    <circle cx="25" cy="25" r="3" fill="url(#goldGrad)"/>
    
    <!-- Swirls / Petals -->
    <path d="M 25 15 C 27 19, 29 19, 25 25 C 21 19, 23 19, 25 15 Z" fill="url(#goldGrad)"/>
    <path d="M 25 35 C 27 31, 29 31, 25 25 C 21 31, 23 31, 25 35 Z" fill="url(#goldGrad)"/>
    <path d="M 15 25 C 19 27, 19 29, 25 25 C 19 21, 19 23, 15 25 Z" fill="url(#goldGrad)"/>
    <path d="M 35 25 C 31 27, 31 29, 25 25 C 31 21, 31 23, 35 25 Z" fill="url(#goldGrad)"/>
  </g>
  
  <!-- Typography -->
  <text x="70" y="32" font-family="'Playfair Display', serif" font-size="20" font-weight="bold" fill="#6B7753">Browtiful</text>
  <text x="70" y="52" font-family="'Playfair Display', serif" font-size="16" font-style="italic" fill="#D4B06A">Strokes</text>
  <text x="145" y="52" font-family="'Inter', sans-serif" font-size="8" font-weight="600" letter-spacing="3" fill="#3B2D24">STUDIO</text>
</svg>

