<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F8F5ED" />
      <stop offset="100%" stop-color="#E4DCCB" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#D4B06A" />
      <stop offset="100%" stop-color="#947435" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="400" height="400" fill="url(#bgGrad)" />
  <rect x="15" y="15" width="370" height="370" rx="8" fill="none" stroke="#E4DCCB" stroke-width="1.5" />
  <rect x="22" y="22" width="356" height="356" rx="6" fill="none" stroke="#D4B06A" stroke-width="0.75" stroke-dasharray="3,3" />

  <!-- Central Visual (Product Jar Outline) -->
  <g transform="translate(200, 180)">
    <!-- Aura/Sunburst -->
    <circle cx="0" cy="0" r="60" fill="none" stroke="#D4B06A" stroke-width="0.5" opacity="0.4" stroke-dasharray="1,4"/>
    
    <!-- Product Jar Outline -->
    <!-- Lid -->
    <rect x="-40" y="-55" width="80" height="15" rx="3" fill="#6B7753" />
    <!-- Jar Neck -->
    <path d="M -32 -40 L 32 -40 L 32 -30 L -32 -30 Z" fill="#E4DCCB" stroke="#6B7753" stroke-width="1.5"/>
    <!-- Jar Body -->
    <path d="M -45 -30 C -45 20, -35 40, -35 50 L 35 50 C 35 40, 45 20, 45 -30 Z" fill="white" stroke="#6B7753" stroke-width="2" />
    
    <!-- Gold Label on Jar -->
    <rect x="-28" y="-15" width="56" height="40" rx="2" fill="url(#goldGrad)" />
    
    <!-- Flower icon on label -->
    <circle cx="0" cy="5" r="4" fill="white" />
    <path d="M 0 -1 Q 3 -4, 5 -1 Q 3 2, 0 5 Z" fill="white" opacity="0.9"/>
    <path d="M 0 11 Q 3 14, 5 11 Q 3 8, 0 5 Z" fill="white" opacity="0.9"/>
    <path d="M -6 5 Q -9 2, -6 -1 Q -3 2, 0 5 Z" fill="white" opacity="0.9"/>
    <path d="M 6 5 Q 9 8, 6 11 Q 3 8, 0 5 Z" fill="white" opacity="0.9"/>
  </g>

  <!-- Product Labels -->
  <text x="200" y="285" font-family="'Playfair Display', serif" font-size="18" font-weight="bold" fill="#6B7753" text-anchor="middle">Premium Henna Product</text>
  <text x="200" y="308" font-family="'Inter', sans-serif" font-size="11" font-weight="600" fill="#D4B06A" letter-spacing="2" text-anchor="middle">100% ORGANIC &amp; FRESH</text>
  <text x="200" y="335" font-family="'Inter', sans-serif" font-size="9" fill="#3B2D24" opacity="0.6" text-anchor="middle">Image Placeholder</text>
</svg>

