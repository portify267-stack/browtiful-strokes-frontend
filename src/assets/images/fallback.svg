<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F8F5ED" />
      <stop offset="100%" stop-color="#E4DCCB" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#D4B06A" />
      <stop offset="100%" stop-color="#947435" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="400" height="400" fill="url(#bgGrad)" />
  <rect x="15" y="15" width="370" height="370" rx="8" fill="none" stroke="#E4DCCB" stroke-width="1.5" />
  <rect x="22" y="22" width="356" height="356" rx="6" fill="none" stroke="#D4B06A" stroke-width="0.75" stroke-dasharray="3,3" />

  <!-- Central Visual (Mandala/Henna Flower Symbol) -->
  <g transform="translate(200, 180)">
    <circle cx="0" cy="0" r="60" fill="none" stroke="#D4B06A" stroke-width="0.5" opacity="0.4" stroke-dasharray="1,4"/>
    <circle cx="0" cy="0" r="45" fill="none" stroke="#6B7753" stroke-width="1" />
    <circle cx="0" cy="0" r="35" fill="none" stroke="url(#goldGrad)" stroke-width="1.5" stroke-dasharray="3,3" />
    
    <!-- Mandala Petals -->
    <path d="M 0 -25 C 8 -12, 8 12, 0 25 C -8 12, -8 -12, 0 -25 Z" fill="url(#goldGrad)" opacity="0.85"/>
    <path d="M -25 0 C -12 -8, 12 -8, 25 0 C 12 8, -12 8, -25 0 Z" fill="url(#goldGrad)" opacity="0.85"/>
    
    <circle cx="0" cy="0" r="6" fill="#6B7753" />
    <circle cx="0" cy="0" r="2" fill="#F8F5ED" />
  </g>

  <!-- Product Labels -->
  <text x="200" y="285" font-family="'Playfair Display', serif" font-size="18" font-weight="bold" fill="#6B7753" text-anchor="middle">Browtiful Strokes</text>
  <text x="200" y="308" font-family="'Inter', sans-serif" font-size="11" font-weight="600" fill="#D4B06A" letter-spacing="2" text-anchor="middle">100% ORGANIC HENNA</text>
  <text x="200" y="335" font-family="'Inter', sans-serif" font-size="9" fill="#3B2D24" opacity="0.6" text-anchor="middle">Asset Loading Fallback</text>
</svg>

